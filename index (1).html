<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMN PRO CRM v4</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--bg1:#141414;--bg2:#1c1c1c;--bg3:#242424;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --t0:#f0f0f0;--t1:#888;--t2:#444;
  --acc:#00e676;--acc2:#00c853;
  --danger:#ff5252;--warn:#ffab40;--info:#448aff;--purple:#ce93d8;
  --sh:rgba(0,0,0,0.6);
}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:15px;background:var(--bg);color:var(--t0)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
button,input,select,textarea{font-family:inherit}
/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
/* HEADER */
.hd{display:flex;align-items:center;gap:8px;padding:0 20px;height:54px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:.95em;font-weight:700;letter-spacing:-.5px;margin-right:8px;white-space:nowrap}
.logo span{color:var(--acc)}
.hd-r{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:nowrap}
.btn{padding:6px 14px;border-radius:7px;border:1px solid var(--border2);background:var(--bg2);color:var(--t0);cursor:pointer;font-size:.8em;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg3);border-color:rgba(255,255,255,.2)}
.btn-acc{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.btn-acc:hover{background:var(--acc2);border-color:var(--acc2)}
.btn-ai{background:linear-gradient(135deg,#7c4dff,#e040fb);color:#fff;border-color:transparent;font-weight:600}
.btn-ai:hover{filter:brightness(1.1)}
.btn-danger{background:var(--bg2);border-color:rgba(255,82,82,.4);color:var(--danger)}
.over-btn{background:var(--danger);color:#fff;border:none;padding:5px 12px;border-radius:20px;font-size:.75em;font-weight:600;cursor:pointer;display:none}
.over-btn.show{display:block}
/* TABS */
.tabs{display:flex;padding:0 20px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;gap:2px}
.tab{padding:10px 14px;border:none;background:none;color:var(--t1);cursor:pointer;font-size:.82em;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--t0)}.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap{flex:1;position:relative}
.search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:1em;pointer-events:none}
.search{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--t0);padding:7px 12px 7px 30px;border-radius:7px;font-size:.85em}
.search:focus{outline:none;border-color:var(--acc)}
/* TOTALS */
.totals{display:flex;gap:6px;padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tot{background:var(--bg1);border:1px solid var(--border);border-top:2px solid var(--c);border-radius:8px;padding:7px 12px;min-width:120px;flex-shrink:0;cursor:default}
.tot-l{font-size:.65em;color:var(--t1);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.tot-v{font-size:.88em;font-weight:700;color:var(--c)}
.tot-n{font-size:.65em;color:var(--t2);margin-top:1px}
/* CONTENT */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.view{display:none;flex:1;min-height:0;overflow:hidden;flex-direction:column}
.view.on{display:flex}
.scroll{overflow-y:auto;flex:1}
/* HOJE */
.hoje-wrap{padding:14px 20px}
.kpi-strip{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.kpi{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:8px;padding:10px 14px;flex:1;min-width:140px}
.kpi-l{font-size:.67em;color:var(--t1);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.kpi-v{font-size:1em;font-weight:700;color:var(--c)}
.hoje-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hoje-col{background:var(--bg1);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.hoje-col-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-top:3px solid var(--c)}
.hoje-col-t{font-size:.82em;font-weight:600}
.hoje-badge{font-size:.7em;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--c);color:#000}
.hoje-items{padding:8px;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.hoje-item{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:6px;padding:8px 10px;cursor:pointer;transition:.15s}
.hoje-item:hover{border-color:var(--acc)}
.hi-emp{font-size:.82em;font-weight:500}
.hi-sub{font-size:.72em;color:var(--t1);margin-top:2px}
.hi-date{font-size:.68em;color:var(--c);margin-top:3px}
.empty-msg{font-size:.75em;color:var(--t2);padding:16px;text-align:center}
/* META SEMANAL */
.sem-card{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:8px;padding:12px 16px;margin-bottom:14px}
.sem-t{font-size:.8em;font-weight:600;color:var(--warn);margin-bottom:8px}
.sem-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sem-item{font-size:.78em;color:var(--t1);display:flex;align-items:center;gap:6px}
.sem-item strong{color:var(--t0)}
.sem-input{width:50px;background:var(--bg2);border:1px solid var(--border2);color:var(--t0);padding:3px 6px;border-radius:5px;font-size:.85em;text-align:center}
.sem-btns{display:flex;gap:6px;flex-wrap:wrap}
.sem-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--t0);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75em}
.sem-btn:hover{background:var(--bg3)}
.sem-btn.danger{color:var(--danger);border-color:rgba(255,82,82,.3)}
/* KANBAN */
.kb-filters{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--bg1);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.kb-filters label{font-size:.78em;color:var(--t1)}
.sel{background:var(--bg2);border:1px solid var(--border2);color:var(--t0);padding:5px 9px;border-radius:6px;font-size:.8em;cursor:pointer}
.kb-board{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;flex:1;min-height:0;align-items:flex-start}
.kcol{display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--border);border-radius:9px;min-width:190px;max-width:210px;flex-shrink:0;max-height:100%;overflow:hidden}
.kcol-h{padding:10px 12px 8px;border-bottom:1px solid var(--border);border-top:3px solid var(--c);flex-shrink:0}
.kcol-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.kcol-name{font-size:.78em;font-weight:600;display:flex;align-items:center;gap:5px}
.kdot{width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0}
.kcol-n{font-size:.7em;font-weight:600;color:var(--t1);background:var(--bg2);padding:1px 7px;border-radius:10px}
.kcol-tot{font-size:.74em;font-weight:600;color:var(--c)}
.kcards{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:40px}
.kcards.dov{background:rgba(0,230,118,.05);border-radius:6px}
/* CARD */
.lc{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:9px 10px;cursor:grab;transition:all .15s;position:relative}
.lc:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.lc.dragging{opacity:.3;cursor:grabbing}
.lc.warn-border{border-left:3px solid var(--warn)}
.lc.danger-border{border-left:3px solid var(--danger)}
.lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;margin-bottom:3px}
.lc-emp{font-size:.82em;font-weight:500;line-height:1.3;flex:1}
.lc-tag{font-size:.62em;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--c);color:#000;flex-shrink:0}
.lc-nome{font-size:.72em;color:var(--t1);margin-bottom:3px}
.lc-val{font-size:.9em;font-weight:700;color:var(--acc);margin-bottom:4px}
.lc-origem{font-size:.65em;color:var(--t2);margin-bottom:2px}
.lc-acao{font-size:.68em;color:var(--warn);margin-bottom:3px}
.lc-hist{font-size:.7em;color:var(--t2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px}
.lc-foot{display:flex;align-items:center;justify-content:space-between}
.lc-date{font-size:.68em;color:var(--t2)}
.lc-date.over{color:var(--danger);font-weight:500}
.lc-btns{display:flex;gap:3px}
.bwp{background:#25d366;color:#fff;border:none;padding:3px 7px;border-radius:4px;cursor:pointer;font-size:.68em;font-weight:600}
.bedit{background:var(--bg3);border:1px solid var(--border2);color:var(--t0);padding:3px 7px;border-radius:4px;cursor:pointer;font-size:.68em}
/* LISTA */
.lista-wrap{padding:12px 20px}
.ltable{width:100%;border-collapse:collapse}
.ltable th{font-size:.76em;font-weight:600;color:var(--t1);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;white-space:nowrap}
.ltable th:hover{color:var(--t0)}
.ltable td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:.82em;vertical-align:middle}
.ltable tr:hover td{background:rgba(255,255,255,.02)}
/* CHARTS */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 20px 0;flex-shrink:0}
.kpi-c{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:8px;padding:11px 13px}
.kpi-c .lbl{font-size:.67em;color:var(--t1);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.kpi-c .val{font-size:.95em;font-weight:700;color:var(--c)}
.kpi-c .sub{font-size:.65em;color:var(--t2);margin-top:2px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 20px}
.charts-grid .w2{grid-column:1/-1}
.cc{background:var(--bg1);border:1px solid var(--border);border-radius:9px;padding:14px}
.cc-t{font-size:.84em;font-weight:600;margin-bottom:10px}
.funnel-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.funnel-lbl{font-size:.74em;width:130px;text-align:right;color:var(--t1);flex-shrink:0}
.funnel-bar-wrap{flex:1;background:var(--bg3);border-radius:4px;height:22px;overflow:hidden}
.funnel-bar{height:100%;border-radius:4px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.funnel-pct{font-size:.7em;font-weight:600;color:#000}
.funnel-n{font-size:.72em;color:var(--t2);width:35px;flex-shrink:0}
/* METAS */
.meta-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ms-card{background:var(--bg1);border:1px solid var(--border);border-top:2px solid var(--c);border-radius:8px;padding:11px 13px}
.ms-l{font-size:.7em;color:var(--t1);margin-bottom:2px}
.ms-v{font-size:.94em;font-weight:700;color:var(--c)}
.ms-of{font-size:.7em;color:var(--t2);margin:2px 0 5px}
.prog{height:5px;background:var(--bg3);border-radius:5px;overflow:hidden;margin-bottom:2px}
.pf{height:100%;border-radius:5px;transition:width .5s}
.ms-pct{font-size:.66em;color:var(--t2);text-align:right}
.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mc{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:12px}
.mc.cur{border-color:var(--acc)}
.mc-m{font-size:.78em;font-weight:600;margin-bottom:1px}
.mc-y{font-size:.67em;color:var(--t2);margin-bottom:7px}
.mc-nums{display:flex;align-items:baseline;gap:5px;margin-bottom:5px}
.mc-v{font-size:1em;font-weight:700}.mc-of{font-size:.76em;color:var(--t1)}
.mc-pct{font-size:.67em;color:var(--t2);text-align:right;margin-bottom:6px}
.fi,.fsel,.fta{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--t0);padding:6px 10px;border-radius:6px;font-size:.86em;transition:.15s}
.fi:focus,.fsel:focus,.fta:focus{outline:none;border-color:var(--acc)}
.fsel option{background:var(--bg1)}
.fi-l{font-size:.72em;color:var(--t2);margin-bottom:3px;display:block}
/* ATIVIDADES */
.atv-wrap{padding:14px 20px;max-width:860px}
.atv-grp{margin-bottom:20px}
.atv-grp-h{font-size:.9em;font-weight:600;color:var(--acc);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.atv-grp-h::after{content:'';flex:1;height:1px;background:var(--border)}
.atv-grp-cnt{font-size:.68em;color:var(--t2);font-weight:400}
.atv-row{background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:0 6px 6px 0;padding:9px 12px;margin-bottom:5px;display:flex;gap:12px;align-items:flex-start}
.atv-co{min-width:140px;flex-shrink:0}
.atv-emp{font-size:.82em;font-weight:500}
.atv-stg{font-size:.68em;color:var(--c);margin-top:2px;font-weight:500}
.atv-txt{flex:1;font-size:.8em;color:var(--t1);line-height:1.5}
.atv-dt{font-size:.7em;color:var(--t2);white-space:nowrap}
/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 20px}
.dash-grid .w2{grid-column:span 2}
.dc{background:var(--bg1);border:1px solid var(--border);border-radius:9px;padding:14px}
.dc-t{font-size:.84em;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dc-badge{font-size:.7em;padding:2px 8px;border-radius:10px;font-weight:600}
.orig-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.orig-lbl{font-size:.76em;width:140px;flex-shrink:0;color:var(--t0)}
.orig-bar-wrap{flex:1;background:var(--bg3);border-radius:3px;height:17px;overflow:hidden}
.orig-bar{height:100%;background:var(--acc);border-radius:3px;transition:width .5s;display:flex;align-items:center;padding-left:5px}
.orig-pct{font-size:.66em;font-weight:600;color:#000}
.orig-n{font-size:.7em;color:var(--t2);width:28px;text-align:right;flex-shrink:0}
.perda-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:.8em}
.perda-row:last-child{border-bottom:none}
.perda-n{font-weight:600;color:var(--danger)}
.etapa-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:.8em}
.etapa-row:last-child{border-bottom:none}
.sem-acao-item{background:var(--bg2);border:1px solid rgba(255,171,64,.25);border-radius:5px;padding:7px 10px;margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sem-acao-item:hover{border-color:var(--warn)}
.sai-emp{font-size:.8em;font-weight:500}
.sai-sub{font-size:.7em;color:var(--t2)}
/* PRODUTOS */
.prods-wrap{padding:14px 20px}
.prods-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prods-t{font-size:.92em;font-weight:600}
.pt{width:100%;border-collapse:collapse}
.pt th{font-size:.76em;font-weight:600;color:var(--t1);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border2)}
.pt td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:.82em}
.pt tr:hover td{background:rgba(255,255,255,.02)}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex!important}
.modal{background:var(--bg1);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-t{font-size:.96em;font-weight:600}
.modal-x{background:none;border:none;color:var(--t1);cursor:pointer;font-size:1.1em;line-height:1;padding:2px}
.modal-x:hover{color:var(--t0)}
.fg{margin-bottom:11px}
.fl{display:block;font-size:.74em;font-weight:500;color:var(--t1);margin-bottom:4px}
.fta{min-height:75px;resize:vertical}
.fg-r2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fg-r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.sep{height:1px;background:var(--border);margin:13px 0}
.modal-foot{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.bdel{background:none;border:1px solid rgba(255,82,82,.4);color:var(--danger);padding:6px 13px;border-radius:6px;cursor:pointer;font-size:.8em;margin-right:auto}
.bcancel{background:var(--bg2);border:1px solid var(--border2);color:var(--t0);padding:6px 13px;border-radius:6px;cursor:pointer;font-size:.8em}
.bsave{background:var(--acc);color:#000;border:none;padding:6px 18px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.8em}
/* CAMPO ALERTA */
.field-warn{background:rgba(255,171,64,.07);border:1px solid rgba(255,171,64,.3);border-radius:6px;padding:7px 10px;font-size:.76em;color:var(--warn);margin-top:6px;display:none}
.field-warn.show{display:block}
/* ATIVIDADES NO MODAL */
.acts-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.act-row{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:6px 9px}
.act-chk{accent-color:var(--acc);cursor:pointer;flex-shrink:0}
.act-body{flex:1;min-width:0}
.act-tipo{font-size:.76em;font-weight:500}
.act-desc{font-size:.72em;color:var(--t1)}
.act-done .act-tipo,.act-done .act-desc{text-decoration:line-through;opacity:.5}
.act-dt{font-size:.68em;color:var(--t2);white-space:nowrap}
.act-rm{background:none;border:none;color:var(--t2);cursor:pointer;font-size:.8em;padding:0 3px}
.act-rm:hover{color:var(--danger)}
.add-act-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:5px}
.add-act-row .fsel{width:auto;font-size:.8em;padding:4px 8px}
.add-act-row .fi{flex:1;min-width:100px;font-size:.8em;padding:4px 8px}
.add-act-row .fi[type=date]{flex:none;width:130px}
.add-act-btn{background:var(--acc);color:#000;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:.78em;font-weight:600;white-space:nowrap}
.wp-link{font-size:.74em;color:#25d366;display:flex;align-items:center;gap:4px;margin-top:3px}
/* AI MODAL */
.ai-ov{z-index:200!important}
.ai-modal{max-width:640px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ai-ico{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#7c4dff,#e040fb);display:flex;align-items:center;justify-content:center;font-size:1.1em;flex-shrink:0}
.ai-title{font-size:.96em;font-weight:600}
.ai-sub{font-size:.73em;color:var(--t2);margin-top:1px}
.ai-key-row{display:flex;gap:7px;margin-bottom:12px}
.ai-key-row .fi{flex:1;font-family:monospace;font-size:.8em}
.ai-ctx{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 11px;font-size:.76em;color:var(--t1);margin-bottom:11px;display:none}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.ai-btn{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;cursor:pointer;text-align:left;transition:.15s}
.ai-btn:hover{border-color:var(--purple);background:rgba(206,147,216,.06)}
.ai-btn-ico{font-size:1.2em;margin-bottom:4px}
.ai-btn-t{font-size:.8em;font-weight:600;color:var(--t0)}
.ai-btn-d{font-size:.7em;color:var(--t1);margin-top:2px;line-height:1.4}
.ai-loading{display:none;align-items:center;gap:8px;color:var(--purple);font-size:.82em;margin-top:10px}
.ai-loading.show{display:flex}
.ai-spinner{width:16px;height:16px;border:2px solid rgba(206,147,216,.3);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result{background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--purple);border-radius:0 7px 7px 0;padding:13px;font-size:.83em;line-height:1.7;white-space:pre-wrap;margin-top:10px;display:none}
.ai-result.show{display:block}
.ai-copy{background:var(--bg3);border:1px solid var(--border2);color:var(--t0);padding:5px 11px;border-radius:5px;cursor:pointer;font-size:.75em;margin-top:7px;display:none}
.ai-copy.show{display:inline-block}
/* PERDA MODAL */
.perda-modal{max-width:420px}
/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:var(--bg1);border:1px solid var(--border2);border-left:3px solid var(--acc);padding:9px 15px;border-radius:8px;font-size:.82em;z-index:400;transform:translateY(60px);transition:.3s;max-width:300px;pointer-events:none}
.toast.show{transform:translateY(0)}
.toast.err{border-left-color:var(--danger)}
</style>
</head>

<script>
// ============================================================
// DADOS
// ============================================================
const STAGES = [
  {id:0, lbl:'Qualificado',      color:'#448aff'},
  {id:1, lbl:'Proposta Enviada', color:'#ffab40'},

  {id:3, lbl:'Aguardando',      color:'#26c6da'},

  {id:6, lbl:'Perdido',         color:'#ef5350'}
];
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_S = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const INIT = [
  {id:'1776514022434',empresa:'JP Locações',nome:'Marquinhos',valor:'800',wp:'+55 17 99155-4022',link:'https://share.google/PlAy85n7qwsxYxUA5',stage:0,next:'2026-04-20',history:'[18/04, 09:07]: Fiz contato com Marquinhos, falei da importância do Google.\nMarcamos para segunda. Ir na empresa dele.',atividades:[],produtoId:'',origem:'Visita Presencial',proxAcao:'',motivoPerda:'',dataFechamento:''},
  {id:'1776451451844',empresa:'AGRIMOTOR - BARRETOS',nome:'Jonas',valor:'800',wp:'+55 17 99225-3444',link:'https://share.google/NY7AK4ne2SVu9ODDl',stage:0,next:'',history:'[17/04, 15:44]: Fiz visita pessoalmente. Jonas tem alguém que cuida mas quer algo mais forte. Vou enviar proposta.',atividades:[],produtoId:'',origem:'Visita Presencial',proxAcao:'Enviar proposta',motivoPerda:'',dataFechamento:''},
  {id:'1776274876658',empresa:'Mãos Na Obra Agro Ferragens',nome:'',valor:'800',wp:'+55 66 9999-6995',link:'',stage:0,next:'2026-04-15',history:'[15/04, 14:41]: Indicação do Adilson de Sinop.',atividades:[],produtoId:'',origem:'Indicação',proxAcao:'',motivoPerda:'',dataFechamento:''},
  {id:'1776257132845',empresa:'Sucatas Tacelli',nome:'Carlinhos',valor:'250',wp:'+55 17 98122-7835',link:'',stage:1,next:'2026-04-17',history:'[15/04, 09:45]: Tomamos café, fiz proposta de subir fotos e montar script de avaliação. Ficou de ver.',atividades:[],produtoId:'',origem:'Visita Presencial',proxAcao:'Follow-up',motivoPerda:'',dataFechamento:''},

  {id:'1776173414692',empresa:'DW Tecnologia',nome:'Karina',valor:'770',wp:'17 98820-4715',link:'',stage:4,next:'2026-05-10',history:'[14/04, 10:30]: Karina se interessou muito. Pediu para retornar dia 10 de maio.',atividades:[],produtoId:'',origem:'Visita Presencial',proxAcao:'Ligar',motivoPerda:'',dataFechamento:''},
  {id:'1776171918356',empresa:'Messias Piscina',nome:'Messias',valor:'770',wp:'17991102473',link:'',stage:4,next:'2026-05-15',history:'[14/04, 10:05]: Estava saindo, não podia atender. Vou ligar amanhã.',atividades:[],produtoId:'',origem:'Visita Presencial',proxAcao:'Ligar',motivoPerda:'',dataFechamento:''},
  {id:'1776107546640',empresa:'Toque Feminino',nome:'Marcia/Camila',valor:'770',wp:'17 98116-0240',link:'',stage:2,next:'',history:'[18/04, 09:09]: Mandei 3 mensagens, não respondeu.\n[13/04, 16:12]: Falei com Camila. Não tem perfil Google. Mudou de endereço.',atividades:[],produtoId:'',origem:'Visita Presencial',proxAcao:'',motivoPerda:'',dataFechamento:''}
];

let leads = [], prods = [], goals = {}, wk = {}, curView = 'hoje', aiLead = null, editId = null, editProdId = null, tempActs = [], dragId = null, charts = {}, lSort = {c:'',d:1};

// ============================================================
// INIT
// ============================================================
function init() {
  loadData();
  const k = localStorage.getItem('crm_aikey');
  if (k) document.getElementById('aiKey').value = k;
  render();
  checkOver();
}

function loadData() {
  // Tentar V4 primeiro
  const v4 = localStorage.getItem('crm_v4');
  if (v4) {
    try {
      const d = JSON.parse(v4);
      leads = (d.leads || []).map(normLead);
      prods = d.prods || [];
      goals = d.goals || {};
      wk = d.wk || {};
      return;
    } catch(e) {}
  }
  // Tentar migrar V3
  const v3 = localStorage.getItem('crm_leads_v3');
  if (v3) {
    try {
      leads = JSON.parse(v3).map(l => normLead(migStage(l)));
      toast('Dados do CRM anterior importados!');
      save();
      return;
    } catch(e) {}
  }
  // Tentar V2
  const v2 = localStorage.getItem('crm_leads');
  if (v2) {
    try {
      leads = JSON.parse(v2).map(l => normLead(migStage(l)));
      toast('Dados do CRM anterior importados!');
      save();
      return;
    } catch(e) {}
  }
  leads = INIT.map(normLead);
}

function normLead(l) {
  return {
    id: l.id || gid(),
    empresa: l.empresa || '',
    nome: l.nome || '',
    valor: l.valor || '0',
    wp: l.wp || '',
    link: l.link || '',
    stage: typeof l.stage === 'number' ? l.stage : 0,
    next: l.next || '',
    history: l.history || '',
    atividades: l.atividades || [],
    produtoId: l.produtoId || '',
    origem: l.origem || '',
    proxAcao: l.proxAcao || '',
    motivoPerda: l.motivoPerda || '',
    dataFechamento: l.dataFechamento || ''
  };
}

function migStage(l) {
  if (l._migrated) return l;
  let s = l.stage;
  if (s === 3) s = 4;
  else if (s === 4) s = 5;
  else if (s === 5) s = 6;
  return {...l, stage: s, _migrated: true};
}

function save() {
  localStorage.setItem('crm_v4', JSON.stringify({leads, prods, goals, wk}));
}

// ============================================================
// UTILS
// ============================================================
function gid() { return Date.now().toString() + Math.random().toString(36).slice(2,5); }
function fR(v) { return 'R$\u00a0' + parseFloat(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2}); }
function isOver(d) { return d && new Date(d) < new Date(new Date().toDateString()); }
function stg(id) { return STAGES.find(s => s.id === id) || STAGES[0]; }
function wpUrl(n) { if(!n) return ''; const c = n.replace(/\D/g,''); return 'https://wa.me/' + (c.startsWith('55') ? c : '55'+c); }
function getFiltered() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  if (!q) return leads;
  return leads.filter(l =>
    l.empresa.toLowerCase().includes(q) ||
    (l.nome||'').toLowerCase().includes(q) ||
    (l.origem||'').toLowerCase().includes(q) ||
    (l.history||'').toLowerCase().includes(q)
  );
}
function hasNoAct(l) { return l.stage !== 5 && l.stage !== 6 && (!l.proxAcao || !l.next); }
function fechKey(l) {
  if (l.dataFechamento) return l.dataFechamento.slice(0,7);
  const h = l.history || '';
  const m = h.match(/\[(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?,\s*\d{2}:\d{2}\].*?(fechad|pagou)/i);
  if (m) return (m[3]||'2026') + '-' + m[2].padStart(2,'0');
  const m2 = h.match(/\[(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if (m2) return (m2[3]||'2026') + '-' + m2[2].padStart(2,'0');
  return null;
}
function leadMonthKey(l) {
  const h = l.history || '';
  const m = h.match(/\[(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if (m) return (m[3]||'2026') + '-' + m[2].padStart(2,'0');
  if (l.next) return l.next.slice(0,7);
  return null;
}

// ============================================================
// RENDER DISPATCH
// ============================================================
function render() {
  renderTotals();
  checkOver();
  if (curView === 'hoje') renderHoje();
  else if (curView === 'kanban') renderKanban();
  else if (curView === 'lista') renderLista();
  else if (curView === 'ativ') renderAtiv();
  else if (curView === 'dash') renderDash();
  else if (curView === 'charts') renderCharts();
  else if (curView === 'metas') renderMetas();
  else if (curView === 'prods') renderProds();
}

function setView(v, el) {
  curView = v;
  document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  document.getElementById('v-' + v).classList.add('on');
  el.classList.add('on');
  render();
}

// ============================================================
// TOTALS
// ============================================================
function renderTotals() {
  const fl = getFiltered();
  document.getElementById('totalsBar').innerHTML = STAGES.map(s => {
    const sl = fl.filter(l => l.stage === s.id);
    const tot = sl.reduce((a,l) => a + parseFloat(l.valor||0), 0);
    return '<div class="tot" style="--c:' + s.color + '"><div class="tot-l">' + s.lbl + '</div><div class="tot-v">' + fR(tot) + '</div><div class="tot-n">' + sl.length + ' lead' + (sl.length!==1?'s':'') + '</div></div>';
  }).join('');
}

// ============================================================
// HOJE
// ============================================================
function renderHoje() {
  const today = new Date().toISOString().slice(0,7);
  const todayFull = new Date().toISOString().slice(0,10);
  const active = leads.filter(l => l.stage !== 5 && l.stage !== 6);
  const vencidos = active.filter(l => isOver(l.next));
  const hoje = active.filter(l => l.next === todayFull);
  const semAcao = active.filter(l => hasNoAct(l));
  const proximos = active.filter(l => l.next && l.next > todayFull).sort((a,b) => a.next.localeCompare(b.next)).slice(0,8);
  const mrr = leads.filter(l => l.stage === 5).reduce((a,l) => a + parseFloat(l.valor||0), 0);
  const pipeline = active.reduce((a,l) => a + parseFloat(l.valor||0), 0);

  const listaVH = [...vencidos, ...hoje.filter(x => !vencidos.find(v => v.id === x.id))];

  function itemHtml(l, c) {
    const s = stg(l.stage);
    const dd = l.next ? l.next.split('-').reverse().join('/') : '';
    let h = '<div class="hoje-item" style="--c:' + (c||s.color) + '" onclick="openLead(\'' + l.id + '\')">';
    h += '<div class="hi-emp">' + l.empresa + '</div>';
    h += '<div class="hi-sub">' + (l.nome ? '👤 ' + l.nome + ' · ' : '') + '<span style="color:' + s.color + '">' + s.lbl + '</span>' + (l.proxAcao ? ' · ' + l.proxAcao : '') + '</div>';
    if (dd) h += '<div class="hi-date">📅 ' + dd + '</div>';
    h += '</div>';
    return h;
  }

  function colHtml(title, list, c, emptyMsg) {
    let h = '<div class="hoje-col" style="--c:' + c + '">';
    h += '<div class="hoje-col-h"><div class="hoje-col-t">' + title + '</div><div class="hoje-badge" style="background:' + c + ';color:#000">' + list.length + '</div></div>';
    h += '<div class="hoje-items">';
    if (list.length) list.forEach(l => { h += itemHtml(l, c); });
    else h += '<div class="empty-msg">' + emptyMsg + '</div>';
    h += '</div></div>';
    return h;
  }

  // KPIs
  let kpis = '<div class="kpi-strip">';
  kpis += '<div class="kpi" style="--c:var(--acc)"><div class="kpi-l">MRR (Fechados)</div><div class="kpi-v">' + fR(mrr) + '</div></div>';
  kpis += '<div class="kpi" style="--c:var(--info)"><div class="kpi-l">Pipeline Ativo</div><div class="kpi-v">' + fR(pipeline) + '</div></div>';
  kpis += '<div class="kpi" style="--c:var(--warn)"><div class="kpi-l">Sem Próx. Ação</div><div class="kpi-v">' + semAcao.length + ' leads</div></div>';
  kpis += '<div class="kpi" style="--c:var(--danger)"><div class="kpi-l">Vencidos</div><div class="kpi-v">' + vencidos.length + ' leads</div></div>';
  kpis += '</div>';

  // Semana
  const mon = new Date(); mon.setDate(mon.getDate() - (mon.getDay()===0?6:mon.getDay()-1));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const mStr = mon.toISOString().slice(0,10).split('-').reverse().slice(0,2).join('/');
  const sStr = sun.toISOString().slice(0,10).split('-').reverse().slice(0,2).join('/');
  let sem = '<div class="sem-card">';
  sem += '<div class="sem-t">📊 Meta Semanal de Prospecção <span style="font-size:.85em;font-weight:400;color:var(--t2)">' + mStr + ' – ' + sStr + '</span></div>';
  sem += '<div class="sem-row">';
  sem += '<div class="sem-item">Visitas: <strong>' + (wk.vf||0) + '</strong> / <input class="sem-input" type="number" value="' + (wk.v||0) + '" onchange="setWk(\'v\',this.value)"></div>';
  sem += '<div class="sem-item">Contatos: <strong>' + (wk.cf||0) + '</strong> / <input class="sem-input" type="number" value="' + (wk.c||0) + '" onchange="setWk(\'c\',this.value)"></div>';
  sem += '<div class="sem-item">Propostas: <strong>' + (wk.pf||0) + '</strong> / <input class="sem-input" type="number" value="' + (wk.p||0) + '" onchange="setWk(\'p\',this.value)"></div>';
  sem += '</div><div class="sem-btns">';
  sem += '<button class="sem-btn" onclick="addWk(\'vf\')">+1 Visita feita</button>';
  sem += '<button class="sem-btn" onclick="addWk(\'cf\')">+1 Contato feito</button>';
  sem += '<button class="sem-btn" onclick="addWk(\'pf\')">+1 Proposta enviada</button>';
  sem += '<button class="sem-btn danger" onclick="resetWk()">Resetar semana</button>';
  sem += '</div></div>';

  // Grid
  let grid = '<div class="hoje-grid">';
  grid += colHtml('⚠️ Vencidos + Hoje', listaVH, 'var(--danger)', 'Tudo em dia! ✅');
  grid += colHtml('🚨 Sem Próxima Ação', semAcao, 'var(--warn)', 'Todos têm ação! ✅');
  grid += colHtml('📅 Próximos Contatos', proximos, 'var(--info)', 'Sem agendamentos futuros');
  grid += '</div>';

  document.getElementById('hojeBody').innerHTML = kpis + sem + grid;
}

function setWk(k, v) { wk[k] = parseInt(v)||0; save(); }
function addWk(k) { wk[k] = (wk[k]||0)+1; save(); renderHoje(); }
function resetWk() { wk.vf=0; wk.cf=0; wk.pf=0; save(); renderHoje(); }

// ============================================================
// KANBAN
// ============================================================
function renderKanban() {
  const months = new Set();
  leads.forEach(l => {
    const mk = leadMonthKey(l);
    if (mk) months.add(mk);
    if (l.next) months.add(l.next.slice(0,7));
  });
  const mArr = [...months].sort().reverse();
  const sel = document.getElementById('kbMonth');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todos</option>' + mArr.map(m => {
    const parts = m.split('-');
    return '<option value="' + m + '"' + (m===cur?' selected':'') + '>' + MONTHS[parseInt(parts[1])-1] + ' ' + parts[0] + '</option>';
  }).join('');

  const fl = getFiltered();
  const fMonth = sel.value;
  const overOnly = document.getElementById('kbOver').checked;
  const noActOnly = document.getElementById('kbNoAct').checked;

  let vis = fl;
  if (fMonth) {
    vis = vis.filter(l => {
      if (l.stage===5 && l.dataFechamento) return l.dataFechamento.slice(0,7) === fMonth;
      const mk = leadMonthKey(l);
      const nk = l.next ? l.next.slice(0,7) : null;
      return mk===fMonth || nk===fMonth;
    });
  }
  if (overOnly) vis = vis.filter(l => isOver(l.next) && l.stage!==5 && l.stage!==6);
  if (noActOnly) vis = vis.filter(l => hasNoAct(l));

  document.getElementById('kbBoard').innerHTML = STAGES.map(s => {
    const sl = vis.filter(l => l.stage === s.id);
    const tot = sl.reduce((a,l) => a+parseFloat(l.valor||0), 0);
    let h = '<div class="kcol" style="--c:' + s.color + '">';
    h += '<div class="kcol-h"><div class="kcol-title"><div class="kcol-name"><div class="kdot"></div>' + s.lbl + '</div><span class="kcol-n">' + sl.length + '</span></div><div class="kcol-tot">' + fR(tot) + '</div></div>';
    h += '<div class="kcards" id="col-' + s.id + '" ondragover="onDO(event,' + s.id + ')" ondrop="onDrop(event,' + s.id + ')" ondragleave="onDL(event)">';
    if (sl.length) {
      sl.forEach(l => { h += cardHtml(l, s); });
    } else {
      h += '<div class="empty-msg" style="padding:12px">Sem leads</div>';
    }
    h += '</div></div>';
    return h;
  }).join('');
}

function cardHtml(l, s) {
  const over = isOver(l.next);
  const noAct = hasNoAct(l);
  const wu = wpUrl(l.wp);
  const dd = l.next ? l.next.split('-').reverse().join('/') : '';
  const pa = (l.atividades||[]).filter(a=>!a.done).length;
  let h = '<div class="lc ' + (over?'danger-border':(noAct?'warn-border':'')) + '" id="lc-' + l.id + '" draggable="true" ondragstart="onDS(event,\'' + l.id + '\')" ondragend="onDE()">';
  h += '<div class="lc-top"><div class="lc-emp">' + l.empresa + '</div><div class="lc-tag" style="background:' + s.color + '">' + s.lbl.split(' ')[0] + '</div></div>';
  if (l.nome) h += '<div class="lc-nome">👤 ' + l.nome + '</div>';
  h += '<div class="lc-val">' + fR(l.valor) + '</div>';
  if (l.origem) h += '<div class="lc-origem">📍 ' + l.origem + '</div>';
  if (pa) h += '<div class="lc-acao">⏰ ' + pa + ' ativ. pendente' + (pa>1?'s':'') + '</div>';
  if (noAct) h += '<div class="lc-acao">⚡ Sem próx. ação</div>';
  else if (l.proxAcao) h += '<div style="font-size:.68em;color:var(--t2);margin-bottom:2px">→ ' + l.proxAcao + '</div>';
  const histLine = (l.history||'').split('\n').find(x => x.trim());
  if (histLine) h += '<div class="lc-hist">' + histLine.replace(/\[.*?\]:\s*/,'') + '</div>';
  h += '<div class="lc-foot"><div class="lc-date ' + (over?'over':'') + '">' + (dd?(over?'⚠️ ':'📅 ')+dd:'') + '</div>';
  h += '<div class="lc-btns">';
  if (wu) h += '<a href="' + wu + '" target="_blank"><button class="bwp">WA</button></a>';
  h += '<button class="bedit" onclick="openLead(\'' + l.id + '\')">✏️</button>';
  h += '</div></div></div>';
  return h;
}

// DRAG DROP
function onDS(e, id) {
  dragId = id;
  setTimeout(() => { const el = document.getElementById('lc-'+id); if(el) el.classList.add('dragging'); }, 0);
  e.dataTransfer.effectAllowed = 'move';
}
function onDE() {
  if (dragId) { const el = document.getElementById('lc-'+dragId); if(el) el.classList.remove('dragging'); }
  document.querySelectorAll('.kcards').forEach(c => c.classList.remove('dov'));
}
function onDO(e, sid) { e.preventDefault(); document.querySelectorAll('.kcards').forEach(c => c.classList.remove('dov')); const el = document.getElementById('col-'+sid); if(el) el.classList.add('dov'); }
function onDL(e) { e.currentTarget.classList.remove('dov'); }
function onDrop(e, sid) {
  e.preventDefault();
  if (dragId) {
    const l = leads.find(x => x.id === dragId);
    if (l && l.stage !== sid) {
      if (sid === 6 && !l.motivoPerda) {
        pendingPerda = dragId;
        openPerdaModal();
        dragId = null;
        document.querySelectorAll('.kcards').forEach(c => c.classList.remove('dov'));
        return;
      }
      const ts = stamp();
      l.history = ts + ': Movido para ' + STAGES[sid].lbl + '\n' + (l.history||'');
      l.stage = sid;
      save();
    }
    dragId = null;
  }
  document.querySelectorAll('.kcards').forEach(c => c.classList.remove('dov'));
  render();
}

function stamp() {
  const n = new Date();
  return '[' + n.getDate().toString().padStart(2,'0') + '/' + (n.getMonth()+1).toString().padStart(2,'0') + ', ' + n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0') + ']';
}

// ============================================================
// LISTA
// ============================================================
function renderLista() {
  const fl = getFiltered();
  let sorted = [...fl];
  const {c, d} = lSort;
  if (c) {
    sorted.sort((a,b) => {
      let av = a[c]||'', bv = b[c]||'';
      if (c==='valor') { av=parseFloat(av); bv=parseFloat(bv); }
      else if (c==='stage') { av=STAGES[av]?.lbl||''; bv=STAGES[bv]?.lbl||''; }
      return d*(av>bv?1:av<bv?-1:0);
    });
  }
  const si = col => lSort.c===col ? (lSort.d===1?' ▲':' ▼') : ' ⇅';
  let rows = '';
  sorted.forEach(l => {
    const s = stg(l.stage);
    const over = isOver(l.next);
    const wu = wpUrl(l.wp);
    const noAct = hasNoAct(l);
    rows += '<tr>';
    rows += '<td style="font-weight:500">' + l.empresa + '</td>';
    rows += '<td>' + (l.nome||'—') + '</td>';
    rows += '<td><span style="background:' + s.color + ';color:#000;padding:2px 8px;border-radius:6px;font-size:.72em;font-weight:500">' + s.lbl + '</span></td>';
    rows += '<td style="font-weight:600;color:var(--acc)">' + fR(l.valor) + '</td>';
    rows += '<td style="font-size:.78em;color:var(--t1)">' + (l.origem||'—') + '</td>';
    rows += '<td style="' + (over?'color:var(--danger);font-weight:500':'') + '">' + (l.next?l.next.split('-').reverse().join('/'):'—') + (over?' ⚠️':'') + '</td>';
    rows += '<td style="font-size:.78em;color:' + (noAct?'var(--warn)':'var(--t1)') + '">' + (l.proxAcao||'—') + (noAct?' ⚡':'') + '</td>';
    rows += '<td>' + (wu?'<a href="'+wu+'" target="_blank" style="color:#25d366;font-weight:500;font-size:.8em">📱</a>':(l.wp||'—')) + '</td>';
    rows += '<td><button class="bedit" onclick="openLead(\'' + l.id + '\')">✏️</button></td>';
    rows += '</tr>';
  });
  document.getElementById('listaBody').innerHTML = '<table class="ltable"><thead><tr>' +
    '<th onclick="sortL(\'empresa\')">Empresa'+si('empresa')+'</th>' +
    '<th onclick="sortL(\'nome\')">Contato'+si('nome')+'</th>' +
    '<th onclick="sortL(\'stage\')">Etapa'+si('stage')+'</th>' +
    '<th onclick="sortL(\'valor\')">Valor'+si('valor')+'</th>' +
    '<th>Origem</th>' +
    '<th onclick="sortL(\'next\')">Próx. Data'+si('next')+'</th>' +
    '<th>Próx. Ação</th><th>WhatsApp</th><th></th>' +
    '</tr></thead><tbody>' + (rows||'<tr><td colspan="9" class="empty-msg">Nenhum lead</td></tr>') + '</tbody></table>';
}
function sortL(col) { if(lSort.c===col) lSort.d*=-1; else{lSort.c=col;lSort.d=1;} renderLista(); }

// ============================================================
// ATIVIDADES
// ============================================================
function renderAtiv() {
  const entries = [];
  leads.forEach(l => {
    (l.history||'').split('\n').forEach(line => {
      const m = line.match(/\[(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?,\s*(\d{2}:\d{2})\]/);
      if (m) entries.push({day:parseInt(m[1]),month:parseInt(m[2]),year:m[3]?parseInt(m[3]):2026,text:line.replace(/\[.*?\]:\s*/,''),lead:l,s:stg(l.stage)});
    });
  });
  entries.sort((a,b) => new Date(b.year,b.month-1,b.day) - new Date(a.year,a.month-1,a.day));
  const grps = {};
  entries.forEach(e => {
    const k = e.year + '-' + e.month.toString().padStart(2,'0');
    if (!grps[k]) grps[k] = {lbl: MONTHS[e.month-1] + ' ' + e.year, items: []};
    grps[k].items.push(e);
  });
  const keys = Object.keys(grps).sort((a,b) => b.localeCompare(a));
  let html = '';
  keys.forEach(k => {
    const g = grps[k];
    html += '<div class="atv-grp"><div class="atv-grp-h">' + g.lbl + '<span class="atv-grp-cnt">' + g.items.length + ' registro' + (g.items.length!==1?'s':'') + '</span></div>';
    g.items.forEach(e => {
      html += '<div class="atv-row" style="--c:' + e.s.color + '">';
      html += '<div class="atv-co"><div class="atv-emp">' + e.lead.empresa + '</div><div class="atv-stg">' + e.s.lbl + '</div></div>';
      html += '<div class="atv-txt">' + e.text + '</div>';
      html += '<div class="atv-dt">' + e.day.toString().padStart(2,'0') + '/' + e.month.toString().padStart(2,'0') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  });
  document.getElementById('ativBody').innerHTML = html || '<div class="empty-msg" style="padding:40px">Nenhuma atividade</div>';
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDash() {
  const active = leads.filter(l => l.stage!==5 && l.stage!==6);
  const closed = leads.filter(l => l.stage===5);
  const lost = leads.filter(l => l.stage===6);
  const semAcao = active.filter(l => hasNoAct(l));
  const vencidos = active.filter(l => isOver(l.next));

  // Origem
  const oriMap = {};
  leads.forEach(l => {
    const o = l.origem || 'Não informado';
    if (!oriMap[o]) oriMap[o] = {n:0,f:0,vf:0};
    oriMap[o].n++;
    if (l.stage===5) { oriMap[o].f++; oriMap[o].vf+=parseFloat(l.valor||0); }
  });
  const oriList = Object.entries(oriMap).sort((a,b)=>b[1].n-a[1].n);
  const maxOri = Math.max(...oriList.map(x=>x[1].n), 1);

  // Perda
  const perdaMap = {};
  lost.forEach(l => { const m = l.motivoPerda||'Não informado'; perdaMap[m]=(perdaMap[m]||0)+1; });
  const perdaList = Object.entries(perdaMap).sort((a,b)=>b[1]-a[1]);

  // Origem HTML
  let oriHtml = '';
  oriList.forEach(([o,d]) => {
    const pct = Math.round((d.n/leads.length)*100);
    const conv = d.n ? Math.round((d.f/d.n)*100) : 0;
    const w = Math.round((d.n/maxOri)*100);
    oriHtml += '<div class="orig-row"><div class="orig-lbl">' + o + '</div>';
    oriHtml += '<div class="orig-bar-wrap"><div class="orig-bar" style="width:' + w + '%">' + (pct>10?'<span class="orig-pct">'+pct+'%</span>':'') + '</div></div>';
    oriHtml += '<div class="orig-n">' + d.n + '</div>';
    oriHtml += '<div style="font-size:.7em;color:var(--acc);width:55px;text-align:right">' + conv + '% conv</div>';
    oriHtml += '</div>';
  });

  // Etapas
  let etapaHtml = '';
  STAGES.forEach(s => {
    const sl = leads.filter(l => l.stage===s.id);
    const tot = sl.reduce((a,l)=>a+parseFloat(l.valor||0),0);
    etapaHtml += '<div class="etapa-row"><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:' + s.color + ';display:inline-block"></span>' + s.lbl + '</span><span><strong style="color:' + s.color + '">' + sl.length + '</strong> <span style="color:var(--t1)">' + fR(tot) + '</span></span></div>';
  });

  // Perda HTML
  let perdaHtml = perdaList.length ? '' : '<div class="empty-msg">Nenhuma perda registrada</div>';
  perdaList.forEach(([m,n]) => {
    perdaHtml += '<div class="perda-row"><span>' + m + '</span><span class="perda-n">' + n + ' (' + Math.round((n/Math.max(lost.length,1))*100) + '%)</span></div>';
  });

  // Sem ação
  let semAcaoHtml = '';
  if (semAcao.length) {
    semAcao.slice(0,8).forEach(l => {
      semAcaoHtml += '<div class="sem-acao-item" onclick="openLead(\'' + l.id + '\')"><div><div class="sai-emp">' + l.empresa + '</div><div class="sai-sub">' + stg(l.stage).lbl + '</div></div><span style="font-size:.72em;color:var(--warn)">Definir →</span></div>';
    });
    if (semAcao.length>8) semAcaoHtml += '<div class="empty-msg">+' + (semAcao.length-8) + ' outros</div>';
  } else semAcaoHtml = '<div class="empty-msg">Todos têm ação! ✅</div>';

  // Vencidos
  let vencHtml = '';
  if (vencidos.length) {
    vencidos.slice(0,8).forEach(l => {
      vencHtml += '<div class="sem-acao-item" onclick="openLead(\'' + l.id + '\')"><div><div class="sai-emp">' + l.empresa + '</div><div class="sai-sub">' + stg(l.stage).lbl + ' · ' + l.next.split('-').reverse().join('/') + '</div></div><span style="font-size:.72em;color:var(--danger)">' + fR(l.valor) + '</span></div>';
    });

function renderCharts() {

  const active = leads.filter(l => l.stage!==6);

  const totC = closed.reduce((a,l)=>a+parseFloat(l.valor||0),0);
  const ticket = closed.length ? totC/closed.length : 0;
  const taxa = active.length ? (closed.length/active.length)*100 : 0;

  // KPIs

    {lbl:'Pipeline Ativo',val:fR(totP),sub:'em aberto',c:'var(--acc)'},

    {lbl:'Taxa Conversão',val:taxa.toFixed(1)+'%',sub:'leads → cliente',c:'var(--purple)'},
    {lbl:'Total Fechado',val:fR(totC),sub:'acumulado',c:'#66bb6a'},
    {lbl:'Fechados',val:closed.length+' leads',sub:'total',c:'#66bb6a'},

  // Destruir charts antigos

  const topL = [...leads].filter(l=>l.stage!==6).sort((a,b)=>parseFloat(b.valor||0)-parseFloat(a.valor||0)).slice(0,6);

  charts.nl = new Chart(document.getElementById('cNL'),{type:'bar',data:{labels:MONTHS_S,datasets:[{label:'Leads Novos',data:nVals,backgroundColor:'rgba(171,71,188,0.7)',borderRadius:5,borderSkipped:false,order:2},{label:'Fechados',data:cVals.map(v=>v/1000),type:'line',borderColor:'#66bb6a',pointBackgroundColor:'#66bb6a',borderWidth:2,pointRadius:3,fill:false,order:1,yAxisID:'y2'}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'top',labels:{padding:10,font:{size:10}}},tooltip:{callbacks:{label:ctx=>ctx.datasetIndex===0?(ctx.raw+' leads'):(fR(ctx.raw*1000))}}},scales:{x:{grid:{color:gc}},y:{grid:{color:gc}},y2:{position:'right',grid:{display:false},ticks:{callback:v=>'R$'+v+'k'}}}}});
}

function renderMetas() {
  const ach = {};
  leads.filter(l=>l.stage===5).forEach(l => { const mk = fechKey(l); if(mk) ach[mk]=(ach[mk]||0)+parseFloat(l.valor||0); });
  const totG = Object.values(goals).reduce((a,v)=>a+v,0);
  const totA = Object.values(ach).reduce((a,v)=>a+v,0);
  const q2G = [4,5,6].map(m=>goals['2026-'+m.toString().padStart(2,'0')]||0).reduce((a,b)=>a+b,0);
  const q2A = [4,5,6].map(m=>ach['2026-'+m.toString().padStart(2,'0')]||0).reduce((a,b)=>a+b,0);
  const s1G = Array.from({length:6},(_,i)=>goals['2026-'+(i+1).toString().padStart(2,'0')]||0).reduce((a,b)=>a+b,0);
  const s1A = Array.from({length:6},(_,i)=>ach['2026-'+(i+1).toString().padStart(2,'0')]||0).reduce((a,b)=>a+b,0);
  const now = new Date();
  const sumCards = [{lbl:'T2 — Trim.',cur:q2A,tgt:q2G,c:'var(--info)'},{lbl:'S1 — Sem.',cur:s1A,tgt:s1G,c:'var(--purple)'},{lbl:'Anual 2026',cur:totA,tgt:totG,c:'var(--warn)'},{lbl:'Total Fechado',cur:totA,tgt:totG,c:'var(--acc)'}];
  let sumHtml = '<div class="meta-sum">';
  sumCards.forEach(x => {
    const p = x.tgt ? Math.min(100,(x.cur/x.tgt)*100) : 0;
    sumHtml += '<div class="ms-card" style="--c:' + x.c + '"><div class="ms-l">' + x.lbl + '</div><div class="ms-v">' + fR(x.cur) + '</div><div class="ms-of">de ' + fR(x.tgt) + '</div><div class="prog"><div class="pf" style="width:'+p+'%;background:'+x.c+'"></div></div><div class="ms-pct">'+p.toFixed(0)+'%</div></div>';
  });
  sumHtml += '</div>';
  let gridHtml = '<div class="meta-grid">';
  for (let i=0; i<12; i++) {
    const mk = '2026-' + (i+1).toString().padStart(2,'0');
    const tgt = goals[mk]||0; const cur = ach[mk]||0;
    const p = tgt ? Math.min(100,(cur/tgt)*100) : 0;
    const fc = p>=100?'var(--acc)':p>=50?'var(--warn)':'var(--danger)';
    const isCur = i+1===now.getMonth()+1;
    gridHtml += '<div class="mc' + (isCur?' cur':'') + '">';
    gridHtml += '<div class="mc-m">' + MONTHS[i] + (isCur?' <span style="color:var(--acc);font-size:.78em">← atual</span>':'') + '</div>';
    gridHtml += '<div class="mc-y">2026</div>';
    gridHtml += '<div class="mc-nums"><div class="mc-v" style="color:'+fc+'">' + fR(cur) + '</div><div class="mc-of">de ' + fR(tgt) + '</div></div>';
    gridHtml += '<div class="prog"><div class="pf" style="width:'+p+'%;background:'+fc+'"></div></div>';
    gridHtml += '<div class="mc-pct">'+p.toFixed(0)+'% atingido</div>';
    gridHtml += '<label class="fi-l">Meta do mês:</label>';
    gridHtml += '<input type="number" class="fi" value="'+(tgt||'')+'" placeholder="R$ 0,00" onchange="setGoal(\''+mk+'\',this.value)">';
    gridHtml += '</div>';
  }
  gridHtml += '</div>';
  document.getElementById('metasBody').innerHTML = sumHtml + gridHtml;

// ============================================================
// BACKUP / RESTORE
// ============================================================
function doBackup() {
  const blob = new Blob([JSON.stringify({leads,prods,goals,wk},null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gmn_crm_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('Backup salvo!');
}
function doRestore() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = function(e) {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = function(ev) {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.leads) {
          leads = d.leads.map(normLead);
          if (d.prods) prods = d.prods;
          if (d.goals) goals = d.goals;
          if (d.wk) wk = d.wk;
          save();
          render();
          toast('Backup restaurado com sucesso!');
        } else {
          toast('Arquivo inválido', true);
        }
      } catch(err) {
        toast('Erro ao ler o arquivo', true);
      }
    };
    r.readAsText(f);
  };
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => { try { document.body.removeChild(inp); } catch(e){} }, 60000);
}

function onStageChange() {
  const s = parseInt(document.getElementById('fStage').value);
  document.getElementById('fgPerda').style.display = s===6 ? 'block' : 'none';
  document.getElementById('fgFech').style.display = s===5 ? 'block' : 'none';
  checkWarn();
}
function checkWarn() {
  const s = parseInt(document.getElementById('fStage').value);
  const pa = document.getElementById('fAcao').value.trim();
  const nd = document.getElementById('fNext').value;
  const w = document.getElementById('fwarn');
  if (s!==5 && s!==6 && (!pa||!nd)) w.classList.add('show'); else w.classList.remove('show');
}
function updWp() {
  const n = document.getElementById('fWp').value;
  const u = wpUrl(n);
  document.getElementById('wpLink').innerHTML = u ? '<a href="'+u+'" target="_blank" class="wp-link">📱 Abrir WhatsApp</a>' : '';
}
function onProdChange() {
  const p = prods.find(x => x.id === document.getElementById('fProd').value);
  if (p) document.getElementById('fVal').value = p.valor;
}

function openLead(id) {
  editId = id || null;
  aiLead = id || null;
  const modal = document.getElementById('leadOv');
  modal.classList.add('on');
  modal.style.display = 'flex';
  document.getElementById('leadTitle').textContent = id ? 'Editar Lead' : 'Novo Lead';
  document.getElementById('btnDel').style.display = id ? 'block' : 'none';
  document.getElementById('btnLeadAI').style.display = id ? 'inline-flex' : 'none';
  document.getElementById('fProd').innerHTML = '<option value="">— Nenhum —</option>' + prods.map(p => '<option value="'+p.id+'">'+p.nome+' — '+fR(p.valor)+'</option>').join('');
  if (id) {
    const l = leads.find(x => x.id === id);
    if (l) {
      document.getElementById('fEmp').value = l.empresa;
      document.getElementById('fNome').value = l.nome||'';
      document.getElementById('fVal').value = l.valor||'';
      document.getElementById('fWp').value = l.wp||'';
      document.getElementById('fLink').value = l.link||'';
      document.getElementById('fStage').value = l.stage;
      document.getElementById('fNext').value = l.next||'';
      document.getElementById('fHist').value = l.history||'';
      document.getElementById('fProd').value = l.produtoId||'';
      document.getElementById('fOrigem').value = l.origem||'';
      document.getElementById('fAcao').value = l.proxAcao||'';
      document.getElementById('fPerda').value = l.motivoPerda||'';
      document.getElementById('fFech').value = l.dataFechamento||'';
      document.getElementById('fgPerda').style.display = l.stage===6 ? 'block' : 'none';
      document.getElementById('fgFech').style.display = l.stage===5 ? 'block' : 'none';
      tempActs = [...(l.atividades||[])];
      updWp();
    }
  } else {
    ['fEmp','fNome','fVal','fWp','fLink','fNext','fHist','fAcao','fFech'].forEach(x => document.getElementById(x).value = '');
    document.getElementById('fStage').value = '0';
    document.getElementById('fProd').value = '';
    document.getElementById('fOrigem').value = '';
    document.getElementById('fPerda').value = '';
    document.getElementById('fgPerda').style.display = 'none';
    document.getElementById('fgFech').style.display = 'none';
    tempActs = [];
    updWp();
  }
  renderActs();
  checkWarn();
}
function closeLead() {
  const m = document.getElementById('leadOv');
  m.classList.remove('on');
  m.style.display = 'none';
  editId = null; tempActs = []; aiLead = null;
}
function saveLead() {
  const emp = (document.getElementById('fEmp').value||'').trim();
  if (!emp) { toast('Nome da empresa obrigatório', true); return; }
  const stage = parseInt(document.getElementById('fStage').value);
  if (stage === 6 && !document.getElementById('fPerda').value) { toast('Selecione o motivo da perda', true); return; }
  const data = {
    empresa: emp,
    nome: document.getElementById('fNome').value,
    valor: document.getElementById('fVal').value||'0',
    wp: document.getElementById('fWp').value,
    link: document.getElementById('fLink').value,
    stage,
    next: document.getElementById('fNext').value,
    history: document.getElementById('fHist').value,
    produtoId: document.getElementById('fProd').value||'',
    atividades: tempActs,
    origem: document.getElementById('fOrigem').value,
    proxAcao: document.getElementById('fAcao').value,
    motivoPerda: document.getElementById('fPerda').value,
    dataFechamento: document.getElementById('fFech').value||''
  };
  if (editId) {
    const i = leads.findIndex(l => l.id === editId);
    if (i >= 0) leads[i] = {...leads[i], ...data};
  } else {
    const ts = stamp();
    leads.unshift({id: gid(), ...data, history: data.history || (ts + ': Lead criado')});
  }
  save(); closeLead(); render(); toast('Lead salvo!');
}
function deleteLead() {
  if (!editId || !confirm('Excluir este lead?')) return;
  leads = leads.filter(l => l.id !== editId);
  save(); closeLead(); render(); toast('Lead excluído');
}

  el.innerHTML = tempActs.map(a =>
    '<div class="act-row"><input type="checkbox" class="act-chk" '+(a.done?'checked':'')+' onchange="togAct(\''+a.id+'\')">' +
    '<div class="act-body '+(a.done?'act-done':'')+'"><div class="act-tipo">'+a.tipo+'</div>'+(a.desc?'<div class="act-desc">'+a.desc+'</div>':'')+' </div>' +
    (a.data?'<div class="act-dt">'+a.data.split('-').reverse().join('/')+'</div>':'')+
    '<button class="act-rm" onclick="rmAct(\''+a.id+'\')">✕</button></div>'
  ).join('');
}
function addAct() {
  tempActs.push({id:gid(), tipo:document.getElementById('actTipo').value, desc:document.getElementById('actDesc').value.trim(), data:document.getElementById('actData').value, done:false});
  document.getElementById('actDesc').value = '';
  renderActs();
}
function togAct(id) { const a = tempActs.find(x=>x.id===id); if(a) a.done=!a.done; renderActs(); }
function rmAct(id) { tempActs = tempActs.filter(x=>x.id!==id); renderActs(); }

// ============================================================
// PRODUTO MODAL
// ============================================================
function openProd(id) {
  editProdId = id||null;
  document.getElementById('prodOv').classList.add('on');
  document.getElementById('prodTitle').textContent = id ? 'Editar Produto' : 'Novo Produto';
  document.getElementById('btnDelProd').style.display = id ? 'block' : 'none';
  if (id) { const p = prods.find(x=>x.id===id); if(p){document.getElementById('pNome').value=p.nome;document.getElementById('pDesc').value=p.desc||'';document.getElementById('pVal').value=p.valor;} }
  else { ['pNome','pDesc','pVal'].forEach(x=>document.getElementById(x).value=''); }
}
function closeProd() { document.getElementById('prodOv').classList.remove('on'); editProdId=null; }
function saveProd() {
  const nome = (document.getElementById('pNome').value||'').trim();
  if (!nome) { toast('Nome obrigatório', true); return; }
  const data = {nome, desc:document.getElementById('pDesc').value.trim(), valor:document.getElementById('pVal').value||'0'};
  if (editProdId) { const i=prods.findIndex(p=>p.id===editProdId); if(i>=0) prods[i]={...prods[i],...data}; }
  else prods.push({id:gid(),...data});
  save(); closeProd(); if(curView==='prods') renderProds(); toast('Produto salvo!');
}
function deleteProd() {
  if (!editProdId||!confirm('Excluir?')) return;
  prods = prods.filter(p=>p.id!==editProdId);
  save(); closeProd(); if(curView==='prods') renderProds(); toast('Produto excluído');
}

// ============================================================
// PERDA MODAL (DRAG)
// ============================================================
let pendingPerda = null;
function openPerdaModal() { document.getElementById('perdaOv').classList.add('on'); document.getElementById('perdaSel').value=''; }
function closePerdaModal() { document.getElementById('perdaOv').classList.remove('on'); pendingPerda=null; }
function confirmPerda() {
  const m = document.getElementById('perdaSel').value;
  if (!m) { toast('Selecione o motivo', true); return; }
  if (pendingPerda) {
    const l = leads.find(x=>x.id===pendingPerda);
    if (l) { l.history = stamp()+': Movido para Perdido — '+m+'\n'+(l.history||''); l.stage=6; l.motivoPerda=m; save(); }
  }
  closePerdaModal(); render();
}

// ============================================================
// AI
// ============================================================
function saveKey() { localStorage.setItem('crm_aikey', document.getElementById('aiKey').value.trim()); toast('Chave salva!'); }
function openAI() { aiLead=null; _openAI(); }
function openAIWithLead() { _openAI(); }
function closeAI() { const m=document.getElementById('aiOv'); m.classList.remove('on'); m.style.display='none'; }
function _openAI() {
  const aiModal = document.getElementById('aiOv');
  aiModal.classList.add('on');
  aiModal.style.display = 'flex';
  document.getElementById('aiResult').classList.remove('show');
  document.getElementById('aiCopy').classList.remove('show');
  document.getElementById('aiLoading').classList.remove('show');
  const k = localStorage.getItem('crm_aikey');
  if (k) document.getElementById('aiKey').value = k;
  const ctx = document.getElementById('aiCtx');
  if (aiLead) {
    const l = leads.find(x=>x.id===aiLead);
    if (l) { ctx.style.display='block'; ctx.textContent = 'Lead: ' + l.empresa + ' — ' + stg(l.stage).lbl + ' — ' + fR(l.valor); }
  } else ctx.style.display='none';
}
// closeAI definido abaixo
function copyAI() { navigator.clipboard.writeText(document.getElementById('aiResult').textContent).then(()=>toast('Copiado!')); }

async function runAI(tipo) {
  const apiKey = document.getElementById('aiKey').value.trim();
  if (!apiKey) { toast('Cole sua API Key primeiro', true); return; }
  const loading = document.getElementById('aiLoading');
  const result = document.getElementById('aiResult');
  const copy = document.getElementById('aiCopy');
  const loadTxt = document.getElementById('aiLoadTxt');
  result.classList.remove('show'); copy.classList.remove('show'); loading.classList.add('show');
  const lbls = {whatsapp:'Gerando mensagem...',resumo:'Analisando lead...',diagnostico:'Analisando pipeline...',proxacao:'Calculando próxima ação...',metas:'Analisando metas...',score:'Calculando Lead Score...'};
  loadTxt.textContent = lbls[tipo]||'Consultando...';
  const l = aiLead ? leads.find(x=>x.id===aiLead) : null;
  const pipe = leads.map(x=>x.empresa+' ('+stg(x.stage).lbl+', '+fR(x.valor)+', origem:'+(x.origem||'?')+', prox:'+(x.next||'sem data')+', acao:'+(x.proxAcao||'nenhuma')+')').join('\n');
  let prompt = '';
  if (tipo==='whatsapp') {
    if (!l) { toast('Abra um lead primeiro', true); loading.classList.remove('show'); return; }
    prompt = 'Voce e especialista em vendas para pequenas empresas locais. Crie uma mensagem de WhatsApp personalizada para follow-up com este lead. Tom: humano, natural, direto, sem parecer robo. Sem asteriscos ou markdown.\n\nEmpresa: '+l.empresa+'\nContato: '+(l.nome||'?')+'\nEtapa: '+stg(l.stage).lbl+'\nValor: '+fR(l.valor)+'\nOrigem: '+(l.origem||'?')+'\nProxima acao: '+(l.proxAcao||'nenhuma')+'\nHistorico:\n'+(l.history||'sem historico')+'\n\nGere apenas a mensagem.';
  } else if (tipo==='resumo') {
    if (!l) { toast('Abra um lead primeiro', true); loading.classList.remove('show'); return; }
    prompt = 'Analise este lead e responda em 3 partes:\n1. SITUACAO ATUAL (2 linhas)\n2. RISCO PRINCIPAL (1 linha)\n3. PROXIMO PASSO (1 linha clara)\n\nEmpresa: '+l.empresa+'\nEtapa: '+stg(l.stage).lbl+'\nValor: '+fR(l.valor)+'\nHistorico:\n'+(l.history||'sem historico')+'\n\nSeja direto.';
  } else if (tipo==='diagnostico') {
    prompt = 'Analise este pipeline de vendas e responda em 4 partes:\n1. SAUDE GERAL (2 linhas)\n2. TOP 3 LEADS QUENTES (empresa + motivo)\n3. TOP 3 RISCOS (empresa + risco)\n4. ACAO PRIORITARIA HOJE (1 recomendacao)\n\nPipeline:\n'+pipe+'\n\nTotal: '+leads.length+' leads, Fechados: '+leads.filter(l=>l.stage===5).length+', Perdidos: '+leads.filter(l=>l.stage===6).length+'\n\nSeja direto e pratico.';
  } else if (tipo==='proxacao') {
    if (!l) { toast('Abra um lead primeiro', true); loading.classList.remove('show'); return; }
    prompt = 'Sugira a proxima acao ideal para este lead:\nPROXIMA ACAO: [acao especifica]\nDATA IDEAL: [DD/MM/AAAA]\nJUSTIFICATIVA: [1 linha]\n\nEmpresa: '+l.empresa+'\nEtapa: '+stg(l.stage).lbl+'\nHistorico:\n'+(l.history||'sem historico')+'\nHoje: '+new Date().toISOString().slice(0,10);
  } else if (tipo==='metas') {
    const mk = '2026-'+(new Date().getMonth()+1).toString().padStart(2,'0');
    const metaMes = goals[mk]||0;
    const fechado = leads.filter(l=>l.stage===5).reduce((a,x)=>a+parseFloat(x.valor||0),0);
    const pipeline = leads.filter(l=>l.stage!==5&&l.stage!==6).reduce((a,x)=>a+parseFloat(x.valor||0),0);
    prompt = 'Analise o desempenho comercial:\n1. DIAGNOSTICO (esta no caminho?)\n2. O QUE FALTA\n3. 2 MAIORES RISCOS\n4. ACAO URGENTE ESTA SEMANA\n\nMeta do mes: '+fR(metaMes)+'\nFechado: '+fR(fechado)+'\nPipeline: '+fR(pipeline)+'\nLeads abertos: '+leads.filter(l=>l.stage!==5&&l.stage!==6).length+'\nSem acao: '+leads.filter(l=>l.stage!==5&&l.stage!==6&&hasNoAct(l)).length+'\n\nSeja direto.';
  } else if (tipo==='score') {
    const ativos = leads.filter(l=>l.stage!==5&&l.stage!==6);
    prompt = 'Pontue cada lead de 0 a 100 e liste os TOP 5 mais quentes:\n[SCORE] EMPRESA - motivo em 1 linha\n\nLeads:\n'+ativos.map(x=>'- '+x.empresa+' | '+stg(x.stage).lbl+' | '+fR(x.valor)+' | prox:'+(x.next||'sem data')+' | acao:'+(x.proxAcao||'nenhuma')).join('\n');
  }
  try {
    const res = await fetch('https://crm-gmn.estrategistadigital66.workers.dev', {
      method: 'POST',
      headers: {'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    if (data.error) { toast('Erro: '+data.error.message, true); loading.classList.remove('show'); return; }
    const txt = (data.content&&data.content[0]&&data.content[0].text) || 'Sem resposta';
    result.textContent = txt;
    result.classList.add('show');
    copy.classList.add('show');
  } catch(err) {
    result.textContent = 'Erro ao conectar com a API. Verifique sua chave e tente novamente.';
    result.classList.add('show');
  }
  loading.classList.remove('show');
}

// FECHAR MODAIS AO CLICAR FORA
['leadOv','prodOv','overOv','aiOv','perdaOv'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('click', function(e) {
    if (e.target === this) {
      if (id==='leadOv') closeLead();
      else if (id==='prodOv') closeProd();
      else if (id==='overOv') closeOverAlert();
      else if (id==='aiOv') closeAI();
      else if (id==='perdaOv') closePerdaModal();
    }
  });
});

init();
